name: validate workflows

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: checkout pinned toobusy (real SemanticReference class for the Stage 2 simulation)
        run: |
          git clone --quiet https://github.com/nicekriss/toobusy /tmp/toobusy
          git -C /tmp/toobusy checkout --quiet bdbed64499d9351cf400c520e8824e33ad9b9702
      - name: KOR must be reproducible from ENG + overlay
        run: |
          set -e
          for ENG in *_ENG.json; do
            KOR="${ENG%_ENG.json}_KOR.json"
            python tools/build_kor.py "$ENG" /tmp/kor_rebuilt.json
            python - "$KOR" /tmp/kor_rebuilt.json <<'EOF'
          import json,sys
          a=json.load(open(sys.argv[1],encoding='utf-8')); b=json.load(open(sys.argv[2],encoding='utf-8'))
          assert a==b, f"{sys.argv[1]} differs from ENG + overlay; run tools/build_kor.py"
          EOF
          done
      - name: static checks (all root ENG/KOR pairs, archives, README)
        run: python tools/validate_workflow.py --toobusy /tmp/toobusy
      - name: no tracked bytecode
        run: |
          if git ls-files | grep -E '__pycache__|\.pyc$'; then echo "bytecode is tracked"; exit 1; fi
